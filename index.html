<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLITCH X EXECUTOR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #030202;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        /* Resmi tam ekran yapan ve oranını koruyan kapsayıcı */
        .bg-container {
            position: relative;
            width: 100%;
            max-width: 1920px;
            background-image: url('arkaplan.png');
            background-size: contain;
            background-position: top center;
            background-repeat: no-repeat;
            aspect-ratio: 1920 / 1080;
        }
        /* Resmin üzerindeki GENERATE DOWNLOAD LINK butonunun tam üzerine oturan görünmez buton */
        .download-trigger {
            position: absolute;
            bottom: 6.2%;
            left: 50%;
            transform: translateX(-50%);
            width: 26.5%;
            height: 6.5%;
            cursor: pointer;
            background: transparent;
            border: none;
            display: block;
            z-index: 999;
        }
    </style>
</head>
<body>

    <div class="bg-container">
        <!-- Tıklandığında senin indirme linkini açacak gizli alan -->
        <a href="https://share.google" target="_blank" class="download-trigger"></a>
    </div>

</body>
</html>
